plugins {
    id 'com.android.application'
}

// Load release signing credentials from keystore.properties (gitignored).
// Absent file -> release builds go unsigned (repo still builds for everyone else).
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
def hasReleaseSigning = false
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
    hasReleaseSigning = keystoreProps['storeFile'] && keystoreProps['storePassword'] != 'CHANGE_ME'
}

android {
    namespace 'org.limeime'
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    compileSdkVersion 36
    defaultConfig {
        applicationId "org.limeime"

        minSdkVersion 25
        targetSdkVersion 36
        versionCode 202661320
        versionName 'v6.1.32'

        //multiDexEnabled = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs += ["-Xlint:deprecation"]


            options.compilerArgs += ["-Xlint:unchecked"]
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
        }
    }
    productFlavors {
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt']
        }
    }
    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    sourceSets {
        main {
            java {
                srcDirs = ['src/main/java']
            }
            res {
                srcDirs = ['src/main/res']
            }
            assets {
                srcDirs = ['src/main/assets']
            }
            aidl {
                srcDirs = ['src/main/aidl']
            }
            manifest {
                srcFile 'src/main/AndroidManifest.xml'
            }
        }
        androidTest {
            java {
                srcDirs = ['src/androidTest/java']
            }
            manifest {
                srcFile 'src/androidTest/AndroidManifest.xml'
            }
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("LIMEHD${android.defaultConfig.versionCode}-${android.defaultConfig.versionName}.apk")
        }
    }
}

def currentReleaseApkName = "LIMEHD${android.defaultConfig.versionCode}-${android.defaultConfig.versionName}.apk"
def preservedReleaseApksDir = layout.buildDirectory.dir("preserved-release-apks")
def releaseDir = layout.projectDirectory.dir("release")
def releaseApkOutputDir = layout.buildDirectory.dir("outputs/apk/release")

tasks.register("preserveReleaseApks", Copy) {
    from(releaseDir) {
        include "*.apk"
        exclude currentReleaseApkName
    }
    into preservedReleaseApksDir
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register("archiveReleaseApk", Copy) {
    from(preservedReleaseApksDir) {
        include "*.apk"
        exclude currentReleaseApkName
    }
    from(releaseApkOutputDir) {
        include "*.apk"
        include "output-metadata.json"
    }
    into releaseDir
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

afterEvaluate {
    tasks.named("preserveReleaseApks").configure {
        dependsOn("packageRelease")
    }
    tasks.named("createReleaseApkListingFileRedirect").configure {
        dependsOn("preserveReleaseApks")
        finalizedBy("archiveReleaseApk")
    }
    tasks.named("archiveReleaseApk").configure {
        mustRunAfter("createReleaseApkListingFileRedirect")
    }
    tasks.named("assembleRelease").configure {
        finalizedBy("archiveReleaseApk")
    }
    tasks.named("packageRelease").configure {
        finalizedBy("archiveReleaseApk")
    }
}

dependencies {
    // implementation fileTree(include: ['*.jar'], dir: 'libs')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'


    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    // implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'

    implementation(platform('org.jetbrains.kotlin:kotlin-bom:2.2.0'))

    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.slidingpanelayout:slidingpanelayout:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'

    // AndroidX Test dependencies
    testImplementation "junit:junit:4.13.2"

    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test:monitor:1.8.0'
    androidTestImplementation 'androidx.fragment:fragment-testing:1.8.9'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-idling-resource:3.7.0'
    androidTestImplementation 'org.mockito:mockito-core:5.14.2'
    androidTestImplementation 'org.mockito:mockito-android:5.14.2'

}
